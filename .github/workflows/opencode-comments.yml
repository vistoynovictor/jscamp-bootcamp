name: opencode - comments

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    if: |
      (contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode') ||
      contains(github.event.issue.body, ' /oc') ||
      startsWith(github.event.issue.body, '/oc') ||
      contains(github.event.issue.body, ' /opencode') ||
      startsWith(github.event.issue.body, '/opencode')) &&
      !contains(github.actor, 'opencode')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        if: env.OPENCODE_API_KEY
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run opencode
        if: env.OPENCODE_API_KEY
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          prompt: |
            Review this issue. If there's a clear fix or relevant docs:
            - Provide documentation links
            - Add error handling guidance for code examples
            Otherwise, do not comment.
