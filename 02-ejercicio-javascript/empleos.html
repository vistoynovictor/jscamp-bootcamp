                <svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                    stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                DevJobs
            </a>
        </h2>

        <nav class="desktopNavbar navbar">
            <a href="./empleos.html">Empleos</a>
            <a href="./empresas.html">Empresas</a>
            <a href="./salarios.html">Salarios</a>
        </nav>

        <div>
            <button class="btn-std">Subir CV</button>

            <button class="btnNavbar">
                <div></div>
                <div></div>
                <div></div>
            </button>
        </div>
    </header>

    <details class="dropdownNavbar">
        <summary></summary>
        <nav class="mobileNavbar navbar">
            <a href="./empleos.html">Empleos</a>
            <a href="./empresas.html">Empresas</a>
            <a href="./salarios.html">Salarios</a>
        </nav>
    </details>



    <main>
        <section class="upper-employment">
            <h1>Encuentra tu próximo trabajo</h1>
            <p>Explora miles de oportunidades en el sector tecnológico.</p>

            <form role="search" class="employment-search">
                <div class="employment-search-bar">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="22" height="22"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"
                        stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-search">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                        <path d="M21 21l-6 -6" />
                    </svg>

                    <input type="text" name="search" placeholder="Buscar empleo por titulo, habilidad o empresa" />
                </div>

                    <div class="filter-bar">
                    <select id="filter-tech" name="filter-tech">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                        <option value="">Tecnologías</option>
                        <option value="html">HTML</option>
                        <option value="node.js">Node.js</option>
                        <option value="css">CSS</option>
                        <option value="javascript">JavaScript</option>
                        <option value="react">React</option>
                        <option value="python">Python</option>
                        <option value="r">R</option>
                        <option value="c / c++">C / C++</option>
                        <option value="sql">SQL</option>
                        <option value="aws">AWS</option>
                        <option value="azure">Azure</option>
                        <option value="gcp">GCP</option>
                        <option value="swift">Swift</option>
                        <option value="kotlin">Kotlin</option>
                    </select>

                    <select id="filter-location" name="filter-location">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                        <option value="">Ubicación</option>
                        <option value="ciudad de mexico">Ciudad de México</option>
                        <option value="guadalajara">Guadalajara</option>
                        <option value="madrid">Madrid</option>
                        <option value="remoto">Remoto</option>
                    </select>

                    <select id="filter-expLevel" name="filter-expLevel">
                        <button>
                            <selectedcontent></selectedcontent>
                        </button>
                        <option value="">Nivel de Experiencia</option>
                        <option value="junior">Junior</option>
                        <option value="mid-level">Mid</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>
            </form>
        </section>

        <section class="job-list-component">

            <h2>Resultados de búsqueda</h2>


            <section>
                <!-- Aquí se generan auntomáticamente las tarjetas-->                
            </section>

            <nav class="pg-num">
                    <!-- Aquí se genera auntomáticamente la paginación--> 
            </nav>

        </section>
    </main>

    </footer>
